<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LED 解决方案生成器</title>
<link rel="icon" href="logo-01.png">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root{
    --ink:#0F1620; --ink2:#1B2534; --paper:#FFFFFF; --desk:#E9EBEF;
    --line:#D8DBE0; --line2:#E8EAEE; --txt:#1C2330; --txt2:#5B6472; --txt3:#8A92A0;
    --phos:#22C55E; --phos-soft:#E6F7EC; --amber:#E8A33D; --danger:#D9534F;
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Noto Sans SC',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
    background:var(--desk); color:var(--txt); font-size:14px; line-height:1.6;
  }
  /* ===== 顶栏 ===== */
  .appbar{
    height:56px;background:var(--ink);color:#fff;display:flex;align-items:center;
    padding:0 20px;gap:16px;position:sticky;top:0;z-index:50;
  }
  .appbar .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
  .appbar .logo svg{display:block}
  .badge{
    font-size:11px;color:var(--phos);border:1px solid rgba(47,230,115,.4);
    padding:2px 8px;border-radius:999px;font-weight:500;
  }
  .appbar .spacer{flex:1}
  .btn{
    font-family:inherit;font-size:13px;padding:8px 14px;border-radius:8px;cursor:pointer;
    border:1px solid transparent;transition:.15s;white-space:nowrap;
  }
  .btn-ghost{background:transparent;color:#C9D2DE;border-color:#33404F}
  .btn-ghost:hover{border-color:#4A5A6E;color:#fff}
  .btn-primary{background:var(--phos);color:#06281A;font-weight:700}
  .btn-primary:hover{background:#3BEF85}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  /* ===== 主布局 ===== */
  .layout{display:flex;min-height:calc(100vh - 56px)}
  .sidebar{
    width:380px;flex-shrink:0;background:var(--paper);border-right:1px solid var(--line);
    padding:20px 20px 40px;
  }
  .preview-pane{flex:1;overflow:auto;padding:28px 28px 80px;display:flex;justify-content:center}
  /* ===== 表单 ===== */
  .fgroup{margin-bottom:22px}
  .fgroup > h3{
    font-size:12px;font-weight:700;color:var(--txt3);letter-spacing:.08em;
    margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line2);
  }
  .frow{margin-bottom:12px}
  .frow label{display:block;font-size:12.5px;color:var(--txt2);margin-bottom:5px}
  .frow input[type=text],.frow input[type=number],.frow select,.frow textarea{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
    font-family:inherit;font-size:14px;color:var(--txt);background:#fff;outline:none;
  }
  .frow textarea{resize:vertical;min-height:60px}
  .frow input:focus,.frow select:focus,.frow textarea:focus{border-color:var(--phos)}
  .fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{
    flex:1;padding:9px 0;border:none;background:#fff;font-family:inherit;font-size:13px;
    color:var(--txt2);cursor:pointer;transition:.15s;
  }
  .seg button.on{background:var(--ink);color:#fff;font-weight:500}
  .hint{font-size:11.5px;color:var(--txt3);margin-top:4px;line-height:1.5}
  /* ===== 文档预览 ===== */
  .doc{
    width:100%;max-width:820px;background:#fff;box-shadow:0 2px 20px rgba(15,22,32,.10);
    padding:56px 64px;border-radius:2px;
  }
  .doc-cover{border-bottom:3px solid var(--ink);padding-bottom:24px;margin-bottom:28px}
  .doc-cover .kicker{font-size:12px;color:var(--txt3);letter-spacing:.15em;margin-bottom:14px}
  .doc-cover h1{font-size:26px;line-height:1.35;font-weight:700;color:var(--ink)}
  .doc-cover .meta{margin-top:18px;font-size:13px;color:var(--txt2);display:grid;grid-template-columns:1fr 1fr;gap:4px 20px}
  .doc-cover .meta b{color:var(--txt);font-weight:500}
  .doc h2{
    font-size:16px;font-weight:700;color:var(--ink);margin:28px 0 12px;
    padding-left:10px;border-left:4px solid var(--phos);
  }
  .doc p{font-size:13.5px;color:#2A3240;margin-bottom:10px;text-align:justify}
  .verdict{
    background:var(--phos-soft);border:1px solid #BEE8CC;border-radius:10px;
    padding:14px 16px;margin:14px 0;display:flex;gap:14px;align-items:flex-start;
  }
  .verdict .big{font-family:var(--mono);font-size:22px;font-weight:600;color:#0B7A3E;line-height:1.15}
  .verdict .sub{font-size:12.5px;color:#236B47}
  table.spec{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px;table-layout:fixed}
  table.spec th,table.spec td{border:1px solid var(--line);padding:7px 10px;text-align:left;word-break:break-all}
  table.spec th{background:#F4F6F8;font-weight:500;color:var(--txt2);width:34%}
  table.spec td .num{font-family:var(--mono)}
  .cab-wrap{margin:14px 0;padding:14px;background:#FAFBFC;border:1px solid var(--line2);border-radius:8px}
  .cab-wrap svg{width:100%;height:auto;display:block}
  .cab-caption{font-size:12px;color:var(--txt3);margin-top:8px;font-family:var(--mono)}
  ul.tight{margin:6px 0 10px 20px;font-size:13.5px}
  ul.tight li{margin-bottom:5px;color:#2A3240}
  .doc-foot{
    margin-top:36px;padding-top:14px;border-top:1px solid var(--line2);
    font-size:11.5px;color:var(--txt3);
  }
  /* AI polish bar */
  .ai-bar{
    display:flex;gap:8px;align-items:center;margin:10px 0 4px;font-size:12px;color:var(--txt2);
  }
  .ai-bar .btn{padding:5px 10px;font-size:12px}
  /* 设置抽屉 */
  .drawer-mask{position:fixed;inset:0;background:rgba(15,22,32,.45);z-index:90;display:none}
  .drawer-mask.open{display:block}
  .drawer{
    position:fixed;top:0;right:-380px;width:360px;height:100vh;background:#fff;z-index:100;
    box-shadow:-4px 0 24px rgba(0,0,0,.15);padding:24px;transition:right .25s;overflow:auto;
  }
  .drawer.open{right:0}
  .drawer h3{font-size:15px;margin-bottom:4px}
  .drawer .close{position:absolute;top:16px;right:16px;cursor:pointer;border:none;background:none;font-size:20px;color:var(--txt3)}
  .toast{
    position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:10px 18px;border-radius:8px;font-size:13px;z-index:200;opacity:0;transition:.2s;pointer-events:none;
  }
  .toast.show{opacity:1}
  /* ===== 响应式 ===== */
  @media (max-width:900px){
    .layout{flex-direction:column}
    .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--line)}
    .doc{padding:28px 22px}
  }
  /* ===== 打印 ===== */
  @media print{
    .appbar,.sidebar,.ai-bar,.no-print{display:none !important}
    .preview-pane{padding:0;display:block;background:#fff}
    .doc{box-shadow:none;max-width:100%;padding:0}
    body{background:#fff}
  }
</style>
</head>
<body>

<!-- ===== 顶栏 ===== -->
<div class="appbar no-print">
  <div class="logo">
    <img src="logo-01.png" style="height:26px;border-radius:4px;display:block">
    LED 解决方案生成器
  </div>
  <span class="badge">Demo · 行业通用参数</span>
  <div class="spacer"></div>
  <button class="btn btn-ghost" id="btnSettings">API 设置</button>
  <button class="btn btn-ghost" id="btnPrint">打印 / PDF</button>
  <button class="btn btn-primary" id="btnWord">导出 Word</button>
</div>

<div class="layout">
  <!-- ===== 左栏：输入表单 ===== -->
  <aside class="sidebar no-print">
    <div class="fgroup">
      <h3>项目信息</h3>
      <div class="frow"><label>客户名称</label><input type="text" id="fCustomer" value="某某集团有限公司"></div>
      <div class="frow"><label>项目名称</label><input type="text" id="fProject" value="总部指挥中心 LED 显示系统"></div>
      <div class="frow"><label>项目地点</label><input type="text" id="fLocation" value="广东省东莞市"></div>
     

    <div class="fgroup">
      <h3>显示需求</h3>
      <div class="frow">
        <label>安装场景</label>
        <div class="seg" id="fScene">
          <button data-v="indoor" class="on">室内</button>
          <button data-v="semi">半户外</button>
          <button data-v="outdoor">户外</button>
        </div>
      </div>
      <div class="fgrid2">
        <div class="frow"><label>屏幕宽 (mm)</label><input type="number" id="fW" value="6000"></div>
        <div class="frow"><label>屏幕高 (mm)</label><input type="number" id="fH" value="3375"></div>
      </div>
      <div class="frow"><label>主观看距离 (m)</label><input type="number" id="fDist" value="5" step="0.5" min="1"></div>
      <div class="frow">
        <label>主要用途</label>
        <select id="fUsage">
          <option>会议室 / 报告</option>
          <option selected>指挥监控中心</option>
          <option>商业广告 / 门头</option>
          <option>舞台演艺</option>
          <option>体育场馆</option>
          <option>展厅 / 展馆</option>
        </select>
      </div>
      <div class="frow">
        <label>方案档次</label>
        <div class="seg" id="fTier">
          <button data-v="eco">经济型</button>
          <button data-v="std" class="on">标准型</button>
          <button data-v="flag">旗舰型</button>
        </div>
      </div>
      <div class="frow"><label>客户补充要求</label><textarea id="fNote" placeholder="如：需前维护、双路备份、含钢结构包边……"></textarea></div>
    </div>

    <div class="fgroup">
      <h3>说明</h3>
      <p class="hint">选型逻辑按「观看距离 ↔ 点间距」行业经验区间自动匹配；产品参数为行业通用 Demo 值。后续替换贵司规格书时，只需修改文件顶部 <code style="font-family:var(--mono);font-size:11px">LIB</code> 配置。</p>
    </div>
  </aside>

  <!-- ===== 右栏：方案预览 ===== -->
  <main class="preview-pane">
    <div class="doc" id="doc">
      <div class="ai-bar no-print">
        <span>方案正文由模板 + 选型计算自动生成</span>
        <div class="spacer" style="flex:1"></div>
        <button class="btn btn-ghost" id="btnAi">AI 润色项目概述</button>
      </div>
      <div id="docBody"></div>
    </div>
  </main>
</div>

<!-- ===== API 设置抽屉 ===== -->
<div class="drawer-mask" id="drawerMask"></div>
<div class="drawer no-print" id="drawer">
  <button class="close" id="drawerClose">×</button>
  <h3>AI 接口配置（可选）</h3>
  <p class="hint" style="margin-bottom:16px">填入 OpenAI 兼容接口后，可一键润色「项目概述」文案。不配置也不影响方案生成。注意：接口需允许浏览器跨域（CORS），否则请自行加代理。Key 仅保存在本机浏览器 localStorage。</p>
  <div class="frow"><label>接口地址 Base URL</label><input type="text" id="cfgUrl" placeholder="https://api.openai.com/v1"></div>
  <div class="frow"><label>API Key</label><input type="text" id="cfgKey" placeholder="sk-..."></div>
  <div class="frow"><label>模型名</label><input type="text" id="cfgModel" placeholder="gpt-4o-mini"></div>
  <button class="btn btn-primary" id="cfgSave" style="width:100%;margin-top:8px">保存配置</button>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
 *  LIB：行业通用产品参数库（Demo）—— 以后替换成贵司规格书只改这里
 * ============================================================ */
const LIB = {
  indoor: [
    { pitch:1.2,  minDist:1.8, maxDist:3.2, cabW:600, cabH:337.5, bright:800,  pAvg:350, pPeak:650, kg:22 },
    { pitch:1.5,  minDist:2.3, maxDist:4.0, cabW:600, cabH:337.5, bright:800,  pAvg:380, pPeak:700, kg:22 },
    { pitch:1.8,  minDist:2.8, maxDist:4.8, cabW:600, cabH:337.5, bright:1000, pAvg:400, pPeak:750, kg:23 },
    { pitch:2.0,  minDist:3.2, maxDist:5.5, cabW:600, cabH:337.5, bright:1000, pAvg:420, pPeak:800, kg:23 },
    { pitch:2.5,  minDist:4.0, maxDist:7.0, cabW:600, cabH:337.5, bright:1200, pAvg:450, pPeak:850, kg:24 },
    { pitch:3.0,  minDist:4.8, maxDist:8.5, cabW:960, cabH:960,   bright:1200, pAvg:500, pPeak:900, kg:30 },
    { pitch:4.0,  minDist:6.5, maxDist:12,  cabW:960, cabH:960,   bright:1500, pAvg:550, pPeak:1000,kg:30 }
  ],
  outdoor: [
    { pitch:4.0,  minDist:6.5, maxDist:12, cabW:960, cabH:960, bright:5000, pAvg:700, pPeak:1400, kg:55 },
    { pitch:5.33, minDist:8.5, maxDist:15, cabW:960, cabH:960, bright:5500, pAvg:750, pPeak:1500, kg:55 },
    { pitch:6.67, minDist:11,  maxDist:20, cabW:960, cabH:960, bright:6000, pAvg:800, pPeak:1600, kg:58 },
    { pitch:8.0,  minDist:13,  maxDist:25, cabW:960, cabH:960, bright:6500, pAvg:850, pPeak:1700, kg:58 },
    { pitch:10.0, minDist:17,  maxDist:35, cabW:960, cabH:960, bright:7000, pAvg:900, pPeak:1800, kg:60 }
  ]
};
const TIER_NAME = { eco:'经典系列', std:'标准系列', flag:'旗舰系列' };
const SCENE_LABEL = { indoor:'室内', semi:'半户外', outdoor:'户外' };

/* ============================================================
 *  选型计算
 * ============================================================ */
function pickModel(scene, dist){
  const pool = (scene === 'outdoor') ? LIB.outdoor : LIB.indoor;
  let best = pool[pool.length-1];
  for(const m of pool){
    if(dist >= m.minDist && dist <= m.maxDist){ best = m; break; }
  }
  if(dist < pool[0].minDist) best = pool[0];
  return best;
}

function compute(){
  const scene = state.scene;
  const W = Math.max(100, parseFloat(el('fW').value) || 6000);
  const H = Math.max(100, parseFloat(el('fH').value) || 3375);
  const D = Math.max(0.5, parseFloat(el('fDist').value) || 5);
  const m = pickModel(scene, D);

  const cols = Math.ceil(W / m.cabW);
  const rows = Math.ceil(H / m.cabH);
  const actW = cols * m.cabW;
  const actH = rows * m.cabH;
  const area = actW * actH / 1e6;
  const pxW = Math.round(actW / m.pitch);
  const pxH = Math.round(actH / m.pitch);
  const cabCount = cols * rows;
  const diagInch = Math.sqrt(actW*actW + actH*actH) / 25.4;

  let bright = m.bright;
  let ipFront = 'IP20', ipBack = 'IP20';
  if(scene === 'semi'){ bright = Math.max(m.bright, 3000); ipFront = 'IP54'; ipBack = 'IP30'; }
  if(scene === 'outdoor'){ ipFront = 'IP65'; ipBack = 'IP54'; }

  const pAvg = area * m.pAvg;
  const pPeak = area * m.pPeak;
  const weight = area * m.kg;
  const rxCount = Math.max(1, Math.ceil(cabCount / 16));
  const txRedundant = cabCount > 48;

  return { scene, W, H, D, m, cols, rows, actW, actH, area, pxW, pxH, cabCount,
           diagInch, bright, ipFront, ipBack, pAvg, pPeak, weight, rxCount, txRedundant };
}

/* ============================================================
 *  渲染方案文档
 * ============================================================ */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
const $ = id => document.getElementById(id);
const el = id => $(id);

let state = { scene:'indoor', tier:'std' };
let aiOverviewOverride = null;

function cabinetSVG(r){
  // 箱体排布示意图：cell 网格
  const W = 480, H = Math.max(80, Math.round(480 * r.actH / r.actW));
  const pad = 30;
  const gw = W - pad*2, gh = H - pad*2;
  const cw = gw / r.cols, ch = gh / r.rows;
  let cells = '';
  for(let i=0;i<r.cols;i++) for(let j=0;j<r.rows;j++){
    cells += `<rect x="${pad + i*cw}" y="${pad + j*ch}" width="${cw-1.5}" height="${ch-1.5}" fill="#E6F7EC" stroke="#22C55E" stroke-width="0.8"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <rect x="${pad-6}" y="${pad-6}" width="${gw+12}" height="${gh+12}" fill="none" stroke="#0F1620" stroke-width="1.2"/>
    ${cells}
    <text x="${W/2}" y="${H-6}" text-anchor="middle" font-size="10" fill="#5B6472" font-family="JetBrains Mono,monospace">${r.actW} mm</text>
    <text x="10" y="${H/2}" font-size="10" fill="#5B6472" font-family="JetBrains Mono,monospace" transform="rotate(-90 10 ${H/2})" text-anchor="middle">${r.actH} mm</text>
  </svg>`;
}

function overviewText(r){
  if(aiOverviewOverride) return aiOverviewOverride;
  const usage = el('fUsage').value;
  return `本方案针对 ${esc(el('fLocation').value)} 的「${esc(el('fProject').value)}」项目编制。根据现场勘测，屏幕安装于${SCENE_LABEL[r.scene]}环境，显示区域目标尺寸约 ${r.W} × ${r.H} mm，主要观看距离约 ${r.D} m，使用场景为${esc(usage)}。结合现场安装条件、观看距离及显示用途，本方案推荐采用点间距 ${r.m.pitch} mm 的${SCENE_LABEL[r.scene]}${r.scene==='outdoor'?'户外':'小间距'}LED 显示系统，整屏物理分辨率 ${r.pxW} × ${r.pxH} 像素，整屏显示面积约 ${r.area.toFixed(2)} ㎡，兼顾近距离细节表现与长期运行可靠性。`;
}

function render(){
  const r = compute();
  const today = new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'});
  const modelName = `${SCENE_LABEL[r.scene]}${r.scene==='outdoor'?'户外':'小间距'} ${r.m.pitch}mm ${TIER_NAME[state.tier]}LED 显示系统`;

  $('docBody').innerHTML = `
   <div class="doc-cover">
  <img src="logo-01.png" style="height:44px;margin-bottom:16px">
      <div class="kicker">LED DISPLAY SOLUTION</div>
      <h1>${esc(el('fProject').value)}<br>LED 显示系统解决方案</h1>
      <div class="meta">
        <span>致：<b>${esc(el('fCustomer').value)}</b></span>
        <span>编制：<b>AET displays.Ltd</b></span>
        <span>地点：${esc(el('fLocation').value)}</span>
        <span>日期：${today}</span>
      </div>
    </div>

    <h2>一、项目概述</h2>
    <p>${overviewText(r)}</p>

    <h2>二、观看距离与点间距选型</h2>
    <div class="verdict">
      <div>
        <div class="big">P${r.m.pitch}</div>
        <div class="sub">推荐点间距</div>
      </div>
      <div style="flex:1">
        <div style="font-size:13px;font-weight:500;color:var(--ink)">最佳观看区间 ${r.m.minDist} – ${r.m.maxDist} m</div>
        <div style="font-size:12.5px;color:var(--txt2);margin-top:2px">本项目主视距 ${r.D} m 落入选型区间；点间距越小，近距离画面越细腻，成本相应越高。${r.D < r.m.minDist ? '当前视距偏近，如预算允许可升级更小点间距型号。' : (r.D > r.m.maxDist ? '当前视距偏远，可评估更大点间距以优化成本。' : '')}</div>
      </div>
    </div>

    <h2>三、显示系统配置</h2>
    <p>整屏由 ${r.cols} × ${r.rows} 个标准箱体拼接而成，实际成屏尺寸 ${r.actW} × ${r.actH} mm（整屏对角线当量约 ${Math.round(r.diagInch)} 英寸），显示面积 ${r.area.toFixed(2)} ㎡。
    <div class="cab-wrap">${cabinetSVG(r)}<div class="cab-caption">箱体排布：${r.cols} 列 × ${r.rows} 行 = ${r.cabCount} 箱 · 单箱 ${r.m.cabW} × ${r.m.cabH} mm</div></div>

    <h2>四、主要技术参数</h2>
    <table class="spec">
      <colgroup><col style="width:34%"><col style="width:66%"></colgroup>
      <tr><th>推荐型号</th><td><span class="num">${esc(modelName)}</span></td></tr>
      <tr><th>点间距</th><td><span class="num">${r.m.pitch} mm</span></td></tr>
      <tr><th>整屏分辨率</th><td><span class="num">${r.pxW} × ${r.pxH} px</span>（约 ${(r.pxW*r.pxH/10000).toFixed(1)} 万像素）</td></tr>
      <tr><th>成屏尺寸</th><td><span class="num">${r.actW} × ${r.actH} mm</span></td></tr>
      <tr><th>显示面积</th><td><span class="num">${r.area.toFixed(2)} ㎡</span></td></tr>
      <tr><th>整屏亮度</th><td><span class="num">${r.bright} cd/㎡</span>${r.scene!=='indoor'?'（自动感光调节）':''}</td></tr>
      <tr><th>刷新率 / 灰度</th><td><span class="num">≥3840 Hz / 14 bit</span></td></tr>
      <tr><th>平均功耗</th><td><span class="num">≈${r.pAvg.toFixed(1)} W</span>（峰值 ≈${r.pPeak.toFixed(1)} W）</td></tr>
      <tr><th>整屏重量（约）</th><td><span class="num">${r.weight.toFixed(0)} kg</span></td></tr>
      <tr><th>防护等级</th><td>正面 <span class="num">${r.ipFront}</span> / 背面 <span class="num">${r.ipBack}</span></td></tr>
      <tr><th>使用寿命</th><td><span class="num">≥100,000 小时</span></td></tr>
    </table>

    <h2>五、系统组成</h2>
    <ul class="tight">
      <li><b>显示单元：</b>${r.cabCount} 个 ${r.m.cabW}×${r.m.cabH} mm 标准箱体，${r.scene==='outdoor'?'前维护设计，箱体内部集成电源与接收卡。':'采用压铸铝箱体，支持前维护，维护空间需求小。'}</li>
      <li><b>控制系统：</b>${r.txRedundant?'发送控制器双机热备份；':'发送控制器 1 台；'}接收卡 ${r.rxCount} 张，支持信号备份与逐点校正。</li>
      <li><b>配电系统：</b>按峰值功耗 ${r.pPeak.toFixed(1)} W 配置配电箱，含空开、防雷与过载保护；${r.scene==='outdoor'?'户外屏体配套独立接地与避雷措施。':'建议双路供电接入。'}</li>
      <li><b>结构与包边：</b>钢结构支架 / 壁挂结构，深色窄边框包边；${r.scene==='outdoor'?'配套防水箱体密封处理与通风散热设计。':'具体结构形式现场复勘后确认。'}</li>
    </ul>

    <h2>六、环境适应性</h2>
    <p>工作温度 ${r.scene==='outdoor' ? '-30℃ ~ +60℃' : '0℃ ~ +40℃'}，相对湿度 10%~90% 无凝露。${r.scene==='outdoor' ? '屏体通过正面 IP65 防尘防水，抗风、抗震按当地风荷载复核钢结构。' : '室内环境长期稳定运行，亮度自适应感光调节，兼顾视觉舒适度与节能。'}产品按项目目标市场选配 CE / FCC / CCC 等相应认证型号。</p>

    <h2>七、服务与保障</h2>
    <ul class="tight">
      <li>整机质保两年，核心器件三年；</li>
      <li>提供现场安装指导、系统调试与操作人员培训；</li>
      <li>7×24 小时响应，远程故障诊断 + 本地工程师上门。</li>
    </ul>

    <div class="doc-foot">
      本方案由 LED 解决方案生成器（Demo）自动生成，所列参数为行业通用参考值，不构成正式报价；最终规格、配置与价格以双方签署的正式技术协议与报价单为准。
    </div>
  `;
}

/* ============================================================
 *  事件绑定
 * ============================================================ */
function bindSeg(id, key){
  $(id).querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{
      $(id).querySelectorAll('button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      state[key] = b.dataset.v;
      render();
    });
  });
}
bindSeg('fScene','scene');
bindSeg('fTier','tier');

['fCustomer','fProject','fLocation','fW','fH','fDist','fUsage','fNote'].forEach(id=>{
  $(id).addEventListener('input', render);
});

/* 导出 Word */
$('btnWord').addEventListener('click', ()=>{
  const inner = $('docBody').innerHTML;
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>body{font-family:'宋体',serif;font-size:12pt;line-height:1.8}table{border-collapse:collapse;width:100%}th,td{border:1px solid #999;padding:6px 10px}th{background:#f0f0f0;width:34%}h1{font-size:20pt}h2{font-size:14pt;border-left:4px solid #22c55e;padding-left:8px}</style></head><body>${inner}</body></html>`;
  const blob = new Blob(['\ufeff' + html], {type:'application/msword'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${el('fProject').value || 'LED显示系统'}_解决方案.doc`;
  a.click();
  toast('已导出 Word 文档');
});

$('btnPrint').addEventListener('click', ()=> window.print());

/* 设置抽屉 */
const drawer = $('drawer'), mask = $('drawerMask');
function openDrawer(){ drawer.classList.add('open'); mask.classList.add('open'); }
function closeDrawer(){ drawer.classList.remove('open'); mask.classList.remove('open'); }
$('btnSettings').addEventListener('click', openDrawer);
$('drawerClose').addEventListener('click', closeDrawer);
mask.addEventListener('click', closeDrawer);

/* AI 配置持久化 */
function loadCfg(){
  try{ return JSON.parse(localStorage.getItem('led_ai_cfg')||'{}'); }catch(e){ return {}; }
}
function saveCfg(){
  const cfg = { url:$('cfgUrl').value.trim(), key:$('cfgKey').value.trim(), model:$('cfgModel').value.trim() };
  localStorage.setItem('led_ai_cfg', JSON.stringify(cfg));
  toast('AI 配置已保存'); closeDrawer();
}
$('cfgSave').addEventListener('click', saveCfg);
(function(){
  const c = loadCfg();
  $('cfgUrl').value = c.url||''; $('cfgKey').value = c.key||''; $('cfgModel').value = c.model||'';
})();

/* AI 润色概述 */
$('btnAi').addEventListener('click', async ()=>{
  const cfg = loadCfg();
  if(!cfg.url || !cfg.key || !cfg.model){
    toast('请先在「API 设置」中填写接口配置'); openDrawer(); return;
  }
  const btn = $('btnAi'); btn.disabled = true; btn.textContent = '润色中…';
  try{
    const prompt = `你是 LED 显示行业资深方案撰写专家。请把下面这段项目概述改写得更专业、更有销售说服力，但不要编造参数、不要改变任何数字，200字以内：\n\n${overviewText(compute())}`;
    const resp = await fetch(cfg.url.replace(/\/$/,'') + '/chat/completions', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
      body: JSON.stringify({ model:cfg.model, messages:[{role:'user', content:prompt}], temperature:0.4 })
    });
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    const data = await resp.json();
    aiOverviewOverride = data.choices?.[0]?.message?.content?.trim() || '';
    render();
    toast('已用 AI 润色项目概述');
  }catch(e){
    toast('AI 调用失败：'+e.message+'（检查接口地址 / Key / CORS）');
  }finally{
    btn.disabled = false; btn.textContent = 'AI 润色项目概述';
  }
});

/* toast */
let toastTimer;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* 首屏渲染 */
render();
</script>
